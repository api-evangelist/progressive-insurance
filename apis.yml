aid: progressive-insurance
name: Progressive Insurance
description: >-
  One of the largest auto insurance providers in the United States offering
  personal auto, motorcycle, boat, RV, home, renters, and commercial insurance.
  Progressive is known for its direct-to-consumer model (1-800-PROGRESSIVE and
  progressive.com), its independent-agent channel, the comparative rate
  quoting experience, and the Snapshot usage-based insurance program that
  prices premiums against telematics-captured driving behaviour from a
  plug-in OBD-II dongle or the Snapshot mobile app. Progressive also runs the
  ForAgents agent portal and a public Developer Portal at developer.progressive.com
  that hosts embedded-quoting APIs for partners — including the Embedded Direct
  auto quoting API, the Commercial Auto Quoting product, and the Certificate of
  Insurance API — alongside private B2B integrations with comparative-rater
  carriers, agency-management systems, and telematics providers.
