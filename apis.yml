apis:
  - aid: progressive-insurance:embedded-direct-quoting
    name: Embedded Direct Quoting API
    description: >-
      Returns an estimated auto insurance rate from consumer-supplied vehicle
      and driver data; partners embed the quote flow directly inside their own
      product surfaces and complete the policy purchase end-to-end. Available
      as both an SDK and a headless API across all 50 states.
    humanURL: https://developer.progressive.com/s/embeddeddirectapidoc
    tags:
      - Quoting
      - Auto Insurance
      - Embedded Insurance
      - Personal Lines
  - aid: progressive-insurance:commercial-auto-quoting
    name: Commercial Auto Quoting API
    description: >-
      Quoting product for commercial auto policies; enables partners to surface
      Progressive commercial-lines coverage and rate options within their
      onboarding or fleet-management flows.
    humanURL: https://developer.progressive.com/s/clautoquoteapidoc
    tags:
      - Quoting
      - Commercial Auto
      - Commercial Insurance
  - aid: progressive-insurance:certificate-of-insurance
    name: Certificate of Insurance API
    description: >-
      Generates or retrieves a certificate of insurance (COI) for a Progressive
      commercial policy; used by lenders, brokers, and operations platforms that
      need real-time proof-of-coverage documents.
    humanURL: https://developer.progressive.com/
    tags:
      - Certificate of Insurance
      - COI
      - Commercial Insurance
      - Documents
